const categories=['金融工具','生活探索','金融工具'],symbols=['↗','✧','⇄'];
let category='全部';
function render(){const query=document.querySelector('#search').value.trim().toLowerCase();let count=0;document.querySelector('#cards').innerHTML=sites.map((s,i)=>{if((category!=='全部'&&categories[i]!==category)||!(s.title+s.description).toLowerCase().includes(query))return '';count++;return '<article class="card"><div class="top"><span class="num">0'+(i+1)+'</span><span class="tag">'+categories[i]+'</span><span class="symbol" aria-hidden="true">'+symbols[i]+'</span></div><div class="body"><h2>'+s.title+'</h2><p class="desc">'+s.description+'</p><div class="qrrow"><img src="'+qrImages[i]+'" alt="'+s.title+' 網址 QR Code"><div class="scan"><strong>手機掃描，立即體驗</strong>使用相機掃描 QR Code<br><a class="download" href="'+qrImages[i]+'" download="CodeByX-QR-'+(i+1)+'.png">下載 QR Code ↓</a></div></div><a class="open" href="'+s.url+'" target="_blank" rel="noopener noreferrer">開啟網站 ↗</a><button class="copy" data-index="'+i+'">複製網站連結</button></div></article>'}).join('');document.querySelector('#empty').style.display=count?'none':'block'}
document.querySelector('#search').addEventListener('input',render);
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.category;document.querySelectorAll('.filter').forEach(x=>{const active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active))});render()}));
document.querySelector('#cards').addEventListener('click',async e=>{const b=e.target.closest('.copy');if(!b)return;const url=sites[Number(b.dataset.index)].url;try{await navigator.clipboard.writeText(url);const t=document.querySelector('#toast');t.textContent='網站連結已複製';t.style.display='block';setTimeout(()=>t.style.display='none',2200)}catch{window.prompt('請複製網站連結',url)}});render();
